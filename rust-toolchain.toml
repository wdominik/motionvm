# Pinned to stable rather than to a version, so that `cargo fmt` and
# `cargo clippy` give the same answer here as on any other machine that has run
# `rustup update`. A fixed version number would be reproducible but would also
# make the first cargo invocation on a new machine download a toolchain.
#
# "stable" means *the stable this machine has*: rustup installs a channel that
# is missing, and never updates one that is already there. That is worth
# knowing because CI is such a machine — the runner images bring their own
# stable and lag the channel by a week or two.
#
# Note that this is not the MSRV. That is `rust-version` in Cargo.toml, which
# says 1.88.0 and means it: the whole workspace and all its targets compile on
# that toolchain, and CI's `msrv` job compiles them there on every push. It
# stands where the code does — let-chains, stable in edition 2024 since 1.88,
# are the newest thing the tree uses — and it rises the day a change needs a
# newer toolchain, never before and never instead of using one.
#
# Cargo reads that number as a floor and refuses an older toolchain by name,
# so it must never be kept as a ceiling for CI's runner images: that turns
# away users on a toolchain the code compiles on, for a limit that belongs to
# the runners. The runner lag is a fact about CI and is described in the
# workflow.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
