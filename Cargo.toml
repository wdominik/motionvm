[workspace]
resolver = "2"
members = [
    "crates/motionvm-formats",
    "crates/motionvm-tools",
    "crates/motionvm-forth",
    "crates/motionvm-render",
    "crates/motionvm-audio",
    "crates/motionvm-engine",
    "crates/motionvm-app",
    "crates/motionvm-testutil",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT"
authors = ["wdominik"]
repository = "https://github.com/wdominik/motionvm"
description = "A reimplementation of the MOTION engine, for the games built with it"

[workspace.dependencies]
motionvm-formats = { path = "crates/motionvm-formats" }
motionvm-forth = { path = "crates/motionvm-forth" }
motionvm-render = { path = "crates/motionvm-render" }
motionvm-audio = { path = "crates/motionvm-audio" }
motionvm-engine = { path = "crates/motionvm-engine" }
motionvm-app = { path = "crates/motionvm-app" }
motionvm-testutil = { path = "crates/motionvm-testutil" }

# The PNG codec. Encode only: the pictures the tools extract and the frame F12
# writes. Nothing here decodes one.
png = "0.18"

# The OPL3 itself. A pure-Rust port of Nuked-OPL3 that tests itself bit-for-bit
# against the C reference, so nothing is lost by not building C. Accuracy is
# the whole point here: nothing in the game defines what the chip does with a
# register, so the chip model is the one component that cannot be derived from
# the material and has to be borrowed from someone who measured silicon.
# LGPL-2.1-or-later, as every Nuked derivative is: handing out a linked binary
# means letting the recipient relink it. NOTICE says what that obliges.
nuked-opl3 = "0.1"
# Sound output. Apache-2.0.
cpal = "0.18"

# The window and the event loop: one window, the keyboard and mouse events the
# game is fed from, the fullscreen toggle. Apache-2.0. This is the frontend's
# entire platform layer — there is no second windowing dependency and no
# graphics API anywhere in the workspace. Held at 0.30 on purpose; the note on
# `rfd` below says what a bump would buy and what it would cost.
winit = "0.30"

# The presenter: hands the window a buffer of 32-bit pixels and puts it on the
# screen with nothing in between. MIT OR Apache-2.0. That is the whole
# requirement — the engine renders in software into an indexed framebuffer and
# `motionvm-app`'s `blit` expands it through the palette — so a GPU stack here
# would be a dependency on something this project does not do.
softbuffer = "0.4"

# The folder dialog that asks for the game directory when the command line
# names none, and the message box that says why a chosen directory is not one.
# MIT. Native on Windows and macOS, on the `windows-sys` and `objc2` crates
# softbuffer and cpal already bring — not the ones winit brings, which are a
# generation older on both axes: rfd resolves `windows-sys 0.61.2` as
# softbuffer does, and `objc2 0.6.4`, `block2 0.6.2` and
# `objc2-foundation 0.3.2` as cpal and softbuffer do, where winit 0.30.13 is
# still on `windows-sys 0.52.0`, `objc2 0.5.2`, `block2 0.5.1` and
# `objc2-foundation 0.2.2`. What rfd itself adds is `objc2-app-kit 0.3.2`, of
# which it is the only user, and `pollster`, reached on the Linux path below.
# Every one of the five pairs `cargo tree --duplicates` reports gets its older
# half from winit and from nothing else, so dropping rfd would clear one of
# the five and leave four standing. The bump that would clear them is winit's,
# and the only release above 0.30.13 is `0.31.0-beta.2`, a pre-release that
# also splits the crate into `winit-core`, `winit-x11` and `winit-wayland` —
# hence 0.30 here.
# On Linux the XDG desktop portal, spoken over a `libdbus` that is loaded at
# run time rather than linked, so nothing new is needed to build — at run time
# it wants the `xdg-desktop-portal` service, which GNOME and KDE ship, and
# falls back to `zenity`. Not the `gtk3` feature: that links GTK at build time
# and would put a development package between a Linux checkout and a window.
rfd = "0.17"

# Lints are declared here and switched on per crate with `[lints] workspace =
# true`, which every member carries. Without that line in the member the table
# below is inert, which is worth knowing because nothing warns about it.
[workspace.lints.rust]
# There is none, and there is no reason for there to be: this reads files and
# pushes pixels around. `forbid` rather than `deny` so that it cannot be
# switched off locally without also editing this line.
unsafe_code = "forbid"
# Everywhere, including public struct fields and enum variants, which are the
# bulk of a format reader's surface — a field's documentation is where the
# offset it was read from is cited, so an undocumented field is an unsourced
# claim. `deny` rather than `warn` so that the rule holds without anyone having
# to remember it.
missing_docs = "deny"

[workspace.lints.clippy]
# The two groups that describe code which is probably wrong rather than code
# which is merely unfashionable. Neither fires today. `pedantic` is deliberately
# absent: this codebase makes deliberate choices it would argue with.
correctness = "deny"
suspicious = "deny"

# The frontend is a software renderer: `blit` in motionvm-app walks every
# physical window pixel on the CPU, and on a Retina display that is five
# million of them a frame. Compiled well that is a millisecond; at opt-level 0
# it is a slideshow, and a slideshow reads as broken hardware rather than as a
# missing flag. So release lets the hot loops inline across crates, and dev
# gets enough optimization to stay playable — lightly on this workspace's own
# code, which still wants debugging, and fully on the dependencies, which do
# not.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
